name: PromptShield Security CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          python -B -m unittest discover -s tests -p "test_*.py"

      - name: Self-Scan for Secrets
        run: |
          python -m promptshield.cli scan promptshield/
