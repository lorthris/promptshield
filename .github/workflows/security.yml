name: PromptShield Security CI

# CI runs on LankySV01, on the self-hosted runner gh-runner-promptshield.
# publish.yml stays on GitHub-hosted runners, because its build job feeds the PyPI
# trusted-publishing job.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One runner serves this repo. Cancel a superseded run, so that the runner checks only
# the last push to each ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    # A pull request from a fork never runs on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lankysv01, promptshield-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          python -B -m unittest discover -s tests -p "test_*.py"

      - name: Self-Scan for Secrets
        run: |
          python -m promptshield.cli scan promptshield/
